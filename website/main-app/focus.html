<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="0; url=growth.html?tab=tabFocus">
  <script>window.location.replace("growth.html?tab=tabFocus");</script>
  <title>Dolphins21 – Focus</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <a href="index.html" class="brand">
        <div class="brand-icon">🐬</div>
        <span>Dolphins21</span>
      </a>
      <ul class="nav-links">
        <li><a href="dashboard.html" class="nav-link" data-i18n="nav_dashboard">Tổng quan</a></li>
        <li><a href="assess.html" class="nav-link" data-i18n="nav_assessment">Đánh giá</a></li>
        <li><a href="growth.html" class="nav-link active" data-i18n="nav_growth">Kế hoạch</a></li>
      </ul>
    </div>
  </header>

  <main class="page-shell">
    <div style="margin-bottom: 24px;">
      <span class="eyebrow" id="focusEyebrow">Action Priority</span>
      <h1 class="page-title" data-i18n="tab_focus">🎯 Focus</h1>
      <p class="page-subtitle" id="focusSubtitle">Phân tích năng lực đang phát triển nhất và ghim tối đa 5 trọng tâm.</p>
    </div>

    <!-- Pinned Active Focus -->
    <div class="surface-card" style="margin-bottom: 32px;">
      <h3 style="font-size: 18px; font-weight: 800; margin-bottom: 16px;" data-i18n="focus_pinned_title">📌 Pinned Focus</h3>
      <div id="pinnedGrid" class="grid-3">
        <!-- Render pinned items -->
      </div>
    </div>

    <!-- All Competencies Sorted by Score -->
    <div class="surface-card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 12px;">
        <h3 style="font-size: 18px; font-weight: 800;" data-i18n="focus_all_title">Tất cả Competencies</h3>
        
        <div class="sort-toolbar-wrapper">
          <span class="sort-label" id="sortLabelText" data-i18n="sort_by_label">Sắp xếp:</span>
          <div class="sort-pill-group" id="focusSortPills">
            <button class="sort-pill active" data-sort="priority">
              <span id="sortPriorityLabel">Ưu tiên</span>
              <span class="tooltip-icon">?</span>
              <span class="tooltip-text" id="sortPriorityTip">Ưu tiên hành động: Ghim trọng tâm + Đang có mục tiêu + Điểm thấp cần cải thiện trước.</span>
            </button>
            <button class="sort-pill" data-sort="importance">
              <span id="sortImportanceLabel">Trọng số</span>
              <span class="tooltip-icon">?</span>
              <span class="tooltip-text" id="sortImportanceTip">Nền tảng cốt lõi: Ưu tiên năng lực tiên quyết về Quản trị lớp học & Mối quan hệ (TC1, TC5.1, TC5.2).</span>
            </button>
            <button class="sort-pill" data-sort="health">
              <span id="sortHealthLabel">Thế mạnh</span>
              <span class="tooltip-icon">?</span>
              <span class="tooltip-text" id="sortHealthTip">Độ vững vàng: Xếp điểm từ Cao xuống Thấp (Stage 4.0 → 1.0) hiển thị vùng thế mạnh.</span>
            </button>
            <button class="sort-pill" data-sort="risk">
              <span id="sortRiskLabel">Rủi ro</span>
              <span class="tooltip-icon">?</span>
              <span class="tooltip-text" id="sortRiskTip">Vùng cảnh báo: Năng lực điểm rất thấp (Stage 1.0 - 1.5) hoặc chưa từng được đánh giá.</span>
            </button>
            <button class="sort-pill" data-sort="model_order">
              <span id="sortModelOrderLabel">Thứ tự chuẩn</span>
              <span class="tooltip-icon">?</span>
              <span class="tooltip-text" id="sortModelOrderTip">Mục lục chuẩn: Xếp tuần tự theo cấu trúc khung Building 21 (TC1.1 → TC5.6).</span>
            </button>
          </div>
        </div>
      </div>
      
      <div id="sortedList" style="display: flex; flex-direction: column; gap: 12px;">
        <!-- Render full list -->
      </div>
    </div>
  </main>

  <script src="js/building21-data.js"></script>
  <script src="js/api-client.js"></script>
  <script src="js/i18n.js"></script>
  <script>
    let currentFocusSort = 'priority';

    document.addEventListener('DOMContentLoaded', () => {
      initSortPills();
      renderFocusPage();
      window.addEventListener('languageChanged', () => {
        updateSortPillsLanguage();
        renderFocusPage();
      });
    });

    function initSortPills() {
      const pills = document.querySelectorAll('#focusSortPills .sort-pill');
      pills.forEach(pill => {
        pill.addEventListener('click', () => {
          pills.forEach(p => p.classList.remove('active'));
          pill.classList.add('active');
          currentFocusSort = pill.dataset.sort;
          renderFocusPage();
        });
      });
      updateSortPillsLanguage();
    }

    function updateSortPillsLanguage() {
      const isEn = I18N.getLang() === 'en';
      const elLabel = document.getElementById('sortLabelText');
      if (elLabel) elLabel.textContent = isEn ? 'Sort by' : 'Sắp xếp:';

      const sortMap = {
        priority: { label: isEn ? 'Priority' : 'Ưu tiên', tip: isEn ? I18N.t('sort_priority_tip') : 'Ưu tiên hành động: Ghim trọng tâm + Đang có mục tiêu + Điểm thấp cần cải thiện trước.' },
        importance: { label: isEn ? 'Importance' : 'Trọng số', tip: isEn ? I18N.t('sort_importance_tip') : 'Nền tảng cốt lõi: Ưu tiên năng lực tiên quyết về Quản trị lớp học & Mối quan hệ (TC1, TC5.1, TC5.2).' },
        health: { label: isEn ? 'Health' : 'Thế mạnh', tip: isEn ? I18N.t('sort_health_tip') : 'Độ vững vàng: Xếp điểm từ Cao xuống Thấp (Stage 4.0 → 1.0) hiển thị vùng thế mạnh.' },
        risk: { label: isEn ? 'Risk' : 'Rủi ro', tip: isEn ? I18N.t('sort_risk_tip') : 'Vùng cảnh báo: Năng lực điểm rất thấp (Stage 1.0 - 1.5) hoặc chưa từng được đánh giá.' },
        model_order: { label: isEn ? 'Model order' : 'Thứ tự chuẩn', tip: isEn ? I18N.t('sort_model_order_tip') : 'Mục lục chuẩn: Xếp tuần tự theo cấu trúc khung Building 21 (TC1.1 → TC5.6).' }
      };

      document.getElementById('sortPriorityLabel').textContent = sortMap.priority.label;
      document.getElementById('sortPriorityTip').textContent = sortMap.priority.tip;
      document.getElementById('sortImportanceLabel').textContent = sortMap.importance.label;
      document.getElementById('sortImportanceTip').textContent = sortMap.importance.tip;
      document.getElementById('sortHealthLabel').textContent = sortMap.health.label;
      document.getElementById('sortHealthTip').textContent = sortMap.health.tip;
      document.getElementById('sortRiskLabel').textContent = sortMap.risk.label;
      document.getElementById('sortRiskTip').textContent = sortMap.risk.tip;
      document.getElementById('sortModelOrderLabel').textContent = sortMap.model_order.label;
      document.getElementById('sortModelOrderTip').textContent = sortMap.model_order.tip;
    }

    function renderFocusPage() {
      const isEn = I18N.getLang() === 'en';
      document.getElementById('focusEyebrow').textContent = isEn ? 'Action Priority' : 'Ưu tiên phát triển';
      document.getElementById('focusSubtitle').textContent = isEn 
        ? 'Competencies in primary growth areas. Pin up to 5 priorities.'
        : 'Phân tích năng lực đang phát triển nhất và ghim tối đa 5 trọng tâm.';

      const ratings = DolphinsStore.getRatings();
      const focus = DolphinsStore.getFocus();
      const goals = DolphinsStore.getGoals();

      const compScores = window.BUILDING21_DATA.competencies.map(c => {
        const indList = window.BUILDING21_DATA.indicators.filter(ind => ind.competency_id === c.id);
        let sum = 0, count = 0;
        indList.forEach(ind => {
          if (ratings[ind.id] && ratings[ind.id].stage) {
            sum += ratings[ind.id].stage;
            count++;
          }
        });
        const avg = count ? (sum / count) : 0;
        return {
          ...c,
          avgScore: avg,
          ratedCount: count,
          totalIndicators: indList.length,
          isPinned: focus.includes(c.id),
          hasActiveGoal: goals.some(g => g.competency_id === c.id)
        };
      });

      // Pinned Grid
      const pinnedItems = compScores.filter(c => c.isPinned);
      const pinnedContainer = document.getElementById('pinnedGrid');
      if (pinnedItems.length === 0) {
        pinnedContainer.innerHTML = `<p style="color: var(--muted-foreground); font-size: 14px;">${I18N.t('focus_pinned_empty')}</p>`;
      } else {
        pinnedContainer.innerHTML = pinnedItems.map(c => `
          <div style="border: 2px solid var(--primary); background: var(--accent); border-radius: var(--radius-md); padding: 16px; display: flex; flex-direction: column; justify-content: space-between;">
            <div>
              <span class="eyebrow">${c.id} · ${c.domain_id}</span>
              <h4 style="font-size: 15px; font-weight: 800; margin: 4px 0 8px;">${c.name}</h4>
              <div style="font-size: 18px; font-weight: 900; color: var(--primary); margin-bottom: 8px;">
                ${c.avgScore ? c.avgScore.toFixed(1) : (isEn ? 'Not assessed' : 'Chưa đánh giá')} / 4.0
              </div>
              <p style="font-size: 12px; color: var(--muted-foreground); margin-bottom: 12px;">
                ${c.ratedCount} / ${c.totalIndicators} ${isEn ? 'indicators assessed' : 'tiêu chí'}
              </p>
            </div>
            <div style="display: flex; gap: 8px;">
              <a href="focus-detail.html?comp=${c.id}" class="btn btn-secondary btn-sm" style="flex: 1; text-align: center;">${isEn ? 'Details →' : 'Chi tiết →'}</a>
              <button onclick="toggleFocusPin('${c.id}')" class="btn btn-secondary btn-sm" style="color: var(--primary);">${isEn ? 'Unpin' : 'Bỏ ghim'}</button>
            </div>
          </div>
        `).join('');
      }

      // Sort logic
      let sortedComps = [...compScores];
      if (currentFocusSort === 'priority') {
        sortedComps.sort((a, b) => {
          const aPin = a.isPinned ? 1 : 0;
          const bPin = b.isPinned ? 1 : 0;
          if (aPin !== bPin) return bPin - aPin;

          const aGoal = a.hasActiveGoal ? 1 : 0;
          const bGoal = b.hasActiveGoal ? 1 : 0;
          if (aGoal !== bGoal) return bGoal - aGoal;

          if (a.ratedCount === 0 && b.ratedCount > 0) return -1;
          if (b.ratedCount === 0 && a.ratedCount > 0) return 1;
          return a.avgScore - b.avgScore;
        });
      } else if (currentFocusSort === 'importance') {
        const foundationList = ['TC1', 'TC5.1', 'TC5.2'];
        sortedComps.sort((a, b) => {
          const aBase = foundationList.some(p => a.id.startsWith(p)) ? 1 : 0;
          const bBase = foundationList.some(p => b.id.startsWith(p)) ? 1 : 0;
          if (aBase !== bBase) return bBase - aBase;
          return a.id.localeCompare(b.id, undefined, { numeric: true });
        });
      } else if (currentFocusSort === 'health') {
        sortedComps.sort((a, b) => {
          if (a.ratedCount === 0 && b.ratedCount > 0) return 1;
          if (b.ratedCount === 0 && a.ratedCount > 0) return -1;
          return b.avgScore - a.avgScore;
        });
      } else if (currentFocusSort === 'risk') {
        sortedComps.sort((a, b) => {
          if (a.ratedCount === 0 && b.ratedCount > 0) return -1;
          if (b.ratedCount === 0 && a.ratedCount > 0) return 1;
          return a.avgScore - b.avgScore;
        });
      } else if (currentFocusSort === 'model_order') {
        sortedComps.sort((a, b) => a.id.localeCompare(b.id, undefined, { numeric: true }));
      }

      // Sorted List
      const sortedContainer = document.getElementById('sortedList');
      sortedContainer.innerHTML = sortedComps.map(c => `
        <div style="border: 1px solid var(--border); border-radius: var(--radius-md); padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; background: ${c.isPinned ? 'var(--accent)' : '#fff'};">
          <div>
            <span class="eyebrow" style="font-size: 11px; margin-bottom: 2px;">${c.id} · ${c.domain_id}</span>
            <div style="font-weight: 700; font-size: 15px;">${c.name}</div>
            <div style="font-size: 12px; color: var(--muted-foreground); margin-top: 4px;">
              ${isEn ? 'Stage' : 'Điểm'}: <strong style="color: var(--primary);">${c.avgScore ? c.avgScore.toFixed(1) : (isEn ? 'Not assessed' : 'Chưa đánh giá')} / 4.0</strong> (${c.ratedCount}/${c.totalIndicators} ${isEn ? 'indicators' : 'tiêu chí'})
            </div>
          </div>
          <div style="display: flex; gap: 8px;">
            <a href="focus-detail.html?comp=${c.id}" class="btn btn-secondary btn-sm">${isEn ? 'Details →' : 'Chi tiết →'}</a>
            <button onclick="toggleFocusPin('${c.id}')" class="btn ${c.isPinned ? 'btn-primary' : 'btn-secondary'} btn-sm">
              ${c.isPinned ? (isEn ? '★ Pinned' : '★ Đã ghim') : (isEn ? '☆ Pin' : '☆ Ghim')}
            </button>
          </div>
        </div>
      `).join('');
    }

    function toggleFocusPin(compId) {
      DolphinsStore.toggleFocus(compId);
      renderFocusPage();
    }
  </script>
</body>
</html>
