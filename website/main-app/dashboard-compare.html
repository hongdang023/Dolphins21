<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dolphins21 – Compare Snapshots</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/components.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <a href="index.html" class="brand">
        <div class="brand-icon">🐬</div>
        <span>Dolphins21</span>
      </a>
      <ul class="nav-links">
        <li><a href="dashboard.html" class="nav-link active" data-i18n="nav_dashboard">Tổng quan</a></li>
        <li><a href="assess.html" class="nav-link" data-i18n="nav_assessment">Đánh giá</a></li>
        <li><a href="growth.html" class="nav-link" data-i18n="nav_growth">Kế hoạch</a></li>
      </ul>
    </div>
  </header>

  <main class="page-shell">
    <div style="margin-bottom: 24px;">
      <a href="dashboard.html" style="color: var(--muted-foreground); text-decoration: none; font-size: 14px; font-weight: 600;" data-i18n="btn_back_dashboard">← Về Tổng quan</a>
      <h1 class="page-title" style="margin-top: 12px;" data-i18n="compare_title">So sánh Snapshots</h1>
      <p class="page-subtitle" data-i18n="compare_subtitle">Xem đối sánh Before vs. After trên biểu đồ Radar.</p>
    </div>

    <!-- Snapshot Selector -->
    <div class="surface-card" style="margin-bottom: 24px;">
      <div style="display: flex; gap: 20px; align-items: center; flex-wrap: wrap;">
        <div style="flex: 1; min-width: 200px;">
          <label class="form-label" data-i18n="compare_snap_a">Snapshot trước</label>
          <select id="selectSnapA" class="form-select"></select>
        </div>
        <div style="flex: 1; min-width: 200px;">
          <label class="form-label" data-i18n="compare_snap_b">Snapshot sau / Hiện tại</label>
          <select id="selectSnapB" class="form-select"></select>
        </div>
        <button id="btnCompare" class="btn btn-primary" style="margin-top: 22px;" data-i18n="compare_btn">So sánh →</button>
      </div>
    </div>

    <!-- Comparison Radar Chart -->
    <div class="surface-card" style="margin-bottom: 24px;">
      <h3 style="font-size: 18px; font-weight: 800; margin-bottom: 16px;" data-i18n="compare_radar_title">Radar Chart Đối Sánh</h3>
      <div style="position: relative; height: 350px; width: 100%;">
        <canvas id="compareRadar"></canvas>
      </div>
    </div>
  </main>

  <script src="js/building21-data.js"></script>
  <script src="js/api-client.js"></script>
  <script src="js/i18n.js"></script>
  <script>
    let compareChart = null;

    document.addEventListener('DOMContentLoaded', () => {
      initComparePage();
      document.getElementById('btnCompare').addEventListener('click', renderComparison);
      window.addEventListener('languageChanged', initComparePage);
    });

    function initComparePage() {
      const isEn = I18N.getLang() === 'en';
      const snapshots = DolphinsStore.getSnapshots();
      const selA = document.getElementById('selectSnapA');
      const selB = document.getElementById('selectSnapB');

      if (snapshots.length === 0) {
        DolphinsStore.createSnapshot(isEn ? 'Snapshot Baseline' : 'Snapshot khởi đầu');
      }

      const allSnaps = DolphinsStore.getSnapshots();
      const dateLocale = isEn ? 'en-US' : 'vi-VN';
      selA.innerHTML = allSnaps.map(s => `<option value="${s.id}">${s.label} (${new Date(s.created_at).toLocaleDateString(dateLocale)})</option>`).join('');
      selB.innerHTML = `<option value="current">${I18N.t('compare_current_live')}</option>` + selA.innerHTML;

      renderComparison();
    }

    function renderComparison() {
      const isEn = I18N.getLang() === 'en';
      const snapAId = document.getElementById('selectSnapA').value;
      const snapBId = document.getElementById('selectSnapB').value;
      const snapshots = DolphinsStore.getSnapshots();
      const currentRatings = DolphinsStore.getRatings();

      const snapA = snapshots.find(s => s.id === snapAId);
      
      let ratingsA = {};
      if (snapA && snapA.items) {
        snapA.items.forEach(it => { ratingsA[it.indicator_id] = it; });
      }

      let ratingsB = currentRatings;
      if (snapBId !== 'current') {
        const snapB = snapshots.find(s => s.id === snapBId);
        if (snapB && snapB.items) {
          ratingsB = {};
          snapB.items.forEach(it => { ratingsB[it.indicator_id] = it; });
        }
      }

      const calcDomainAvg = (ratingsObj) => {
        return window.BUILDING21_DATA.domains.map(d => {
          const dIndicators = window.BUILDING21_DATA.indicators.filter(ind => {
            const comp = window.BUILDING21_DATA.competencies.find(c => c.id === ind.competency_id);
            return comp && comp.domain_id === d.id;
          });
          let sum = 0, count = 0;
          dIndicators.forEach(ind => {
            if (ratingsObj[ind.id] && ratingsObj[ind.id].stage) {
              sum += ratingsObj[ind.id].stage;
              count++;
            }
          });
          return count ? (sum / count).toFixed(1) : 0;
        });
      };

      const dataA = calcDomainAvg(ratingsA);
      const dataB = calcDomainAvg(ratingsB);

      const radarLabels = ['TC.1 Relationships', 'TC.2 Growth & Mindset', 'TC.3 Advisory', 'TC.4 Engagement', 'TC.5 Personalization'];

      const ctx = document.getElementById('compareRadar').getContext('2d');
      if (compareChart) compareChart.destroy();

      compareChart = new Chart(ctx, {
        type: 'radar',
        data: {
          labels: radarLabels,
          datasets: [
            {
              label: isEn ? 'Snapshot A (Earlier)' : 'Snapshot A (Trước)',
              data: dataA,
              backgroundColor: 'rgba(148, 163, 184, 0.2)',
              borderColor: '#94a3b8',
              borderWidth: 2
            },
            {
              label: isEn ? 'Snapshot B (Later/Live)' : 'Snapshot B (Sau/Live)',
              data: dataB,
              backgroundColor: 'rgba(204, 78, 45, 0.25)',
              borderColor: '#cc4e2d',
              borderWidth: 2
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            r: { min: 0, max: 4, ticks: { stepSize: 1 } }
          }
        }
      });
    }
  </script>
</body>
</html>
