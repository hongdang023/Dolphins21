<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mục Tiêu SMART – Dolphins21</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <a href="index.html" class="brand">
        <div class="brand-icon">🐬</div>
        <span>Dolphins21</span>
      </a>
      <ul class="nav-links">
        <li><a href="dashboard.html" class="nav-link">Dashboard</a></li>
        <li><a href="assess.html" class="nav-link">Đánh giá</a></li>
        <li><a href="focus.html" class="nav-link">Focus</a></li>
        <li><a href="goals.html" class="nav-link active">Mục tiêu</a></li>
        <li><a href="evidence.html" class="nav-link">Evidence</a></li>
      </ul>
    </div>
  </header>

  <main class="page-shell">
    <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 24px; flex-wrap: wrap; gap: 16px;">
      <div>
        <span class="eyebrow">Goal Engine</span>
        <h1 class="page-title">Mục Tiêu SMART & Milestones</h1>
        <p class="page-subtitle">Biến đánh giá thành hành động có thời hạn và các cột mốc thực thi cụ thể.</p>
      </div>
      <button id="btnNewGoal" class="btn btn-primary">+ Tạo Mục Tiêu Mới</button>
    </div>

    <!-- Goals List -->
    <div id="goalsContainer" style="display: flex; flex-direction: column; gap: 20px;">
      <!-- Dynamic list -->
    </div>
  </main>

  <script src="js/building21-data.js"></script>
  <script src="js/api-client.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      renderGoals();

      document.getElementById('btnNewGoal').addEventListener('click', () => {
        const compId = prompt('Nhập mã Competency muốn đặt mục tiêu (VD: TC1.1, TC5.7):', 'TC1.1');
        const target = prompt('Stage mục tiêu muốn đạt (1-4):', '3');
        const deadline = prompt('Hạn chót (YYYY-MM-DD):', '2026-12-31');
        const ms1 = prompt('Cột mốc tuần 1-2:', 'Nghiên cứu rubric và thử nghiệm phương pháp mới trong 2 tiết dạy');

        if (compId && target && deadline) {
          DolphinsStore.saveGoal({
            indicator_id: `${compId}-IND-1`,
            competency_id: compId,
            current_stage: 2,
            target_stage: parseInt(target),
            deadline: deadline,
            status: 'active',
            milestones: [
              { id: 'ms_' + Date.now() + '_1', label: ms1 || 'Thực hành thử nghiệm', due_date: deadline, completed: 0, evidence_note: '' },
              { id: 'ms_' + Date.now() + '_2', label: 'Tự đánh giá lại và ghi nhận phản hồi học sinh', due_date: deadline, completed: 0, evidence_note: '' }
            ]
          });
          renderGoals();
        }
      });
    });

    function renderGoals() {
      const container = document.getElementById('goalsContainer');
      const goals = DolphinsStore.getGoals();

      if (goals.length === 0) {
        container.innerHTML = `
          <div class="surface-card" style="text-align: center; padding: 48px 20px;">
            <p style="color: var(--muted-foreground); margin-bottom: 16px;">Bạn chưa tạo mục tiêu phát triển nào.</p>
            <button onclick="document.getElementById('btnNewGoal').click()" class="btn btn-primary">+ Tạo Mục Tiêu Đầu Tiên</button>
          </div>
        `;
        return;
      }

      container.innerHTML = goals.map(g => {
        const comp = window.BUILDING21_DATA.competencies.find(c => c.id === g.competency_id) || { id: g.competency_id, name: g.competency_id };
        const completedMilestones = (g.milestones || []).filter(m => m.completed).length;
        const totalMilestones = (g.milestones || []).length;
        const percent = totalMilestones ? Math.round((completedMilestones / totalMilestones) * 100) : 0;

        return `
          <div class="surface-card">
            <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; flex-wrap: wrap; gap: 12px;">
              <div>
                <span class="eyebrow">${comp.id}</span>
                <h3 style="font-size: 20px; font-weight: 800;">Mục tiêu: Đạt Stage ${g.target_stage} (${comp.name})</h3>
                <div style="font-size: 13px; color: var(--muted-foreground); margin-top: 4px;">
                  Hạn chót: <strong>${g.deadline}</strong> · Trạng thái: <span class="badge" style="background: var(--accent); color: var(--primary);">${g.status}</span>
                </div>
              </div>
              <div style="text-align: right;">
                <div style="font-size: 18px; font-weight: 900; color: var(--primary);">${completedMilestones} / ${totalMilestones}</div>
                <span style="font-size: 12px; color: var(--muted-foreground);">Milestones xong (${percent}%)</span>
              </div>
            </div>

            <div class="progress-bar-bg" style="margin-bottom: 20px;">
              <div class="progress-bar-fill" style="width: ${percent}%;"></div>
            </div>

            <!-- Milestones List -->
            <h4 style="font-size: 15px; font-weight: 800; margin-bottom: 12px;">Cột Mốc Thực Thi (Milestones):</h4>
            <div style="display: flex; flex-direction: column; gap: 10px;">
              ${(g.milestones || []).map(m => `
                <div style="display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border: 1px solid var(--border); border-radius: var(--radius-md); background: ${m.completed ? 'var(--neutral-50)' : '#fff'};">
                  <label style="display: flex; align-items: center; gap: 12px; cursor: pointer; font-size: 14px; font-weight: 600; text-decoration: ${m.completed ? 'line-through' : 'none'}; color: ${m.completed ? 'var(--muted-foreground)' : 'var(--foreground)'};">
                    <input type="checkbox" ${m.completed ? 'checked' : ''} onchange="toggleMilestone('${g.id}', '${m.id}')" style="width: 18px; height: 18px; accent-color: var(--primary);">
                    <span>${m.label}</span>
                  </label>
                  <span style="font-size: 12px; color: var(--muted-foreground);">Hạn: ${m.due_date}</span>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }).join('');
    }

    function toggleMilestone(goalId, milestoneId) {
      const note = prompt('Ghi nhận minh chứng/kết quả thực hiện cột mốc này (tùy chọn):');
      DolphinsStore.toggleMilestone(goalId, milestoneId, note);
      renderGoals();
    }
  </script>
</body>
</html>
