<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="0; url=growth.html?tab=tabEvidence">
  <script>window.location.replace("growth.html?tab=tabEvidence");</script>
  <title>Dolphins21 – Evidence Vault</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <a href="index.html" class="brand">
        <div class="brand-icon">🐬</div>
        <span>Dolphins21</span>
      </a>
      <ul class="nav-links">
        <li><a href="dashboard.html" class="nav-link" data-i18n="nav_dashboard">Tổng quan</a></li>
        <li><a href="assess.html" class="nav-link" data-i18n="nav_assessment">Đánh giá</a></li>
        <li><a href="growth.html" class="nav-link active" data-i18n="nav_growth">Kế hoạch</a></li>
      </ul>
    </div>
  </header>

  <main class="page-shell">
    <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 24px; flex-wrap: wrap; gap: 16px;">
      <div>
        <span class="eyebrow" data-i18n="evidence_eyebrow">Proof of Work</span>
        <h1 class="page-title" data-i18n="evidence_title">Evidence Vault</h1>
        <p class="page-subtitle" data-i18n="evidence_subtitle">Lưu trữ bằng chứng thực tế từ lớp học và phản hồi học sinh.</p>
      </div>
      <button id="btnNewEvidence" class="btn btn-primary" data-i18n="btn_add_evidence">+ Thêm Evidence</button>
    </div>

    <!-- Evidence List -->
    <div id="evidenceContainer" style="display: flex; flex-direction: column; gap: 16px;">
      <!-- Dynamic list -->
    </div>
  </main>

  <script src="js/building21-data.js"></script>
  <script src="js/api-client.js"></script>
  <script src="js/i18n.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      renderEvidencePage();

      document.getElementById('btnNewEvidence').addEventListener('click', () => {
        const isEn = I18N.getLang() === 'en';
        const compId = prompt(isEn ? 'Competency ID (e.g. TC1.1, TC5.7):' : 'Mã Competency (Ví dụ: TC1.1, TC5.7):', 'TC1.1');
        const content = prompt(isEn ? 'Describe authentic classroom practice:' : 'Nhập chi tiết Evidence từ lớp học:');
        if (compId && content) {
          DolphinsStore.saveEvidence({
            indicator_id: `${compId}-IND-1`,
            competency_id: compId,
            date: new Date().toISOString().split('T')[0],
            content: content,
            tags: [compId]
          });
          renderEvidencePage();
        }
      });

      window.addEventListener('languageChanged', renderEvidencePage);
    });

    function formatDateTime(dateStr, isEn) {
      if (!dateStr) return '';
      try {
        const d = new Date(dateStr);
        if (isNaN(d.getTime())) return dateStr;
        if (isEn) {
          return d.toLocaleString('en-US', {
            month: 'short',
            day: 'numeric',
            year: 'numeric',
            hour: '2-digit',
            minute: '2-digit'
          });
        } else {
          const day = String(d.getDate()).padStart(2, '0');
          const month = String(d.getMonth() + 1).padStart(2, '0');
          const year = d.getFullYear();
          const hours = String(d.getHours()).padStart(2, '0');
          const minutes = String(d.getMinutes()).padStart(2, '0');
          return `${hours}:${minutes} · ${day}/${month}/${year}`;
        }
      } catch (e) {
        return dateStr;
      }
    }

    function renderEvidencePage() {
      const isEn = I18N.getLang() === 'en';
      const container = document.getElementById('evidenceContainer');
      const list = DolphinsStore.getEvidence();

      if (list.length === 0) {
        container.innerHTML = `
          <div class="empty-state-box">
            <span class="empty-state-icon">📁</span>
            <h3 class="empty-state-title">${isEn ? 'No Evidence Yet' : 'Chưa có minh chứng nào'}</h3>
            <p class="empty-state-desc">${isEn ? 'Log your first authentic classroom story or enter notes during assessment.' : 'Ghi nhận minh chứng thực tế từ lớp học hoặc nhập ghi chú giải trình trong quá trình đánh giá.'}</p>
            <button onclick="document.getElementById('btnNewEvidence').click()" class="btn btn-primary">
              ${isEn ? '+ Add Evidence' : '+ Thêm Evidence'}
            </button>
          </div>
        `;
        return;
      }

      container.innerHTML = list.map(ev => {
        const comp = window.BUILDING21_DATA.competencies.find(c => c.id === ev.competency_id) || { id: ev.competency_id, name: ev.competency_id, name_vi: ev.competency_id };
        const compName = isEn ? comp.name : (comp.name_vi || comp.name);
        const timeFormatted = formatDateTime(ev.created_at || ev.date, isEn);
        
        let badgeLabel = isEn ? '📁 Evidence' : '📁 Minh chứng';
        if (ev.source === 'assessment_note') {
          badgeLabel = isEn ? '📝 Assessment Note' : '📝 Ghi chú Đánh giá';
        } else if (ev.source === 'weekly_checkin') {
          badgeLabel = isEn ? '⚡ Weekly Check-in' : '⚡ Check-in tuần';
        }

        return `
          <div class="surface-card" style="border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 18px 20px; background: var(--card);">
            <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; flex-wrap: wrap; gap: 10px;">
              <div>
                <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">
                  ${ev.indicator_id ? `<span style="font-size: 0.75rem; font-weight: 800; padding: 2px 8px; background: var(--accent); color: var(--primary); border: 1px solid rgba(204, 78, 45, 0.3); border-radius: 4px;">${ev.indicator_id}</span>` : ''}
                  <span class="eyebrow" style="font-size: 13px; font-weight: 700; color: var(--foreground);">${ev.competency_id ? `${ev.competency_id} · ${compName}` : ''}</span>
                </div>
                <div style="font-size: 12px; color: var(--muted-foreground); margin-top: 4px; display: flex; align-items: center; gap: 4px;">
                  <span>🕒</span>
                  <span>${isEn ? 'Logged on' : 'Thời gian ghi nhận'}: <strong>${timeFormatted}</strong></span>
                </div>
              </div>
              <span class="badge" style="background: var(--accent); color: var(--primary); font-weight: 700; padding: 4px 10px; border-radius: 6px; font-size: 12px;">${badgeLabel}</span>
            </div>
            <div style="background: var(--muted); border-radius: var(--radius-md); padding: 12px 14px; margin-top: 6px;">
              <p style="font-size: 14px; line-height: 1.6; color: var(--foreground); white-space: pre-wrap; margin: 0;">${ev.content}</p>
            </div>
          </div>
        `;
      }).join('');
    }
  </script>
</body>
</html>
