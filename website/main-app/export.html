<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dolphins21 – Export Data</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <a href="index.html" class="brand">
        <div class="brand-icon">🐬</div>
        <span>Dolphins21</span>
      </a>
      <ul class="nav-links">
        <li><a href="dashboard.html" class="nav-link active" data-i18n="nav_dashboard">Tổng quan</a></li>
        <li><a href="assess.html" class="nav-link" data-i18n="nav_assessment">Đánh giá</a></li>
        <li><a href="growth.html" class="nav-link" data-i18n="nav_growth">Kế hoạch</a></li>
      </ul>
    </div>
  </header>

  <main class="page-shell">
    <div style="max-width: 720px; margin: 0 auto;">
      <span class="eyebrow" id="exportEyebrow">Data Portability</span>
      <h1 class="page-title" data-i18n="export_title">Xuất dữ liệu</h1>
      <p class="page-subtitle" data-i18n="export_subtitle">Toàn quyền sao lưu và khôi phục dữ liệu hồ sơ.</p>

      <div class="surface-card" style="margin-bottom: 24px;">
        <h3 style="font-size: 18px; font-weight: 800; margin-bottom: 12px;" data-i18n="export_card1_title">1. Sao lưu JSON</h3>
        <p style="font-size: 14px; color: var(--muted-foreground); margin-bottom: 16px;" data-i18n="export_card1_desc">
          Tải về toàn bộ hồ sơ, ratings, snapshots, goals và evidence.
        </p>
        <button id="btnExportJSON" class="btn btn-primary" data-i18n="btn_export_json">Xuất tệp Backup ↓</button>
      </div>

      <div class="surface-card">
        <h3 style="font-size: 18px; font-weight: 800; margin-bottom: 12px;" data-i18n="export_card2_title">2. Khôi phục JSON</h3>
        <p style="font-size: 14px; color: var(--muted-foreground); margin-bottom: 16px;" data-i18n="export_card2_desc">
          Tải lên tệp backup để khôi phục trạng thái làm việc.
        </p>
        <input type="file" id="importFileInput" accept=".json" style="margin-bottom: 16px; display: block;">
        <button id="btnImportJSON" class="btn btn-secondary" data-i18n="btn_import_json">Khôi phục tệp</button>
      </div>
    </div>
  </main>

  <script src="js/api-client.js"></script>
  <script src="js/i18n.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      renderExportPage();

      document.getElementById('btnExportJSON').addEventListener('click', () => {
        const fullBackup = {
          app: 'Dolphins21',
          version: '1.0',
          exportedAt: new Date().toISOString(),
          profile: DolphinsStore.getProfile(),
          ratings: DolphinsStore.getRatings(),
          snapshots: DolphinsStore.getSnapshots(),
          goals: DolphinsStore.getGoals(),
          evidence: DolphinsStore.getEvidence(),
          weeklyLogs: DolphinsStore.getWeeklyLogs(),
          focus: DolphinsStore.getFocus()
        };

        const blob = new Blob([JSON.stringify(fullBackup, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `dolphins21_backup_${new Date().toISOString().split('T')[0]}.json`;
        a.click();
        URL.revokeObjectURL(url);
      });

      document.getElementById('btnImportJSON').addEventListener('click', () => {
        const isEn = I18N.getLang() === 'en';
        const fileInput = document.getElementById('importFileInput');
        if (!fileInput.files.length) {
          alert(isEn ? 'Please select a JSON backup file.' : 'Vui lòng chọn tệp backup JSON.');
          return;
        }

        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const data = JSON.parse(e.target.result);
            if (data.profile) DolphinsStore.saveProfile(data.profile);
            if (data.ratings) DolphinsStore.set(DolphinsStore.KEYS.RATINGS, data.ratings);
            if (data.snapshots) DolphinsStore.set(DolphinsStore.KEYS.SNAPSHOTS, data.snapshots);
            if (data.goals) DolphinsStore.set(DolphinsStore.KEYS.GOALS, data.goals);
            if (data.evidence) DolphinsStore.set(DolphinsStore.KEYS.EVIDENCE, data.evidence);
            if (data.weeklyLogs) DolphinsStore.set(DolphinsStore.KEYS.WEEKLY_LOGS, data.weeklyLogs);
            if (data.focus) DolphinsStore.set(DolphinsStore.KEYS.FOCUS, data.focus);

            alert(isEn ? 'Restored successfully! Redirecting...' : 'Khôi phục thành công! Đang chuyển về Dashboard...');
            window.location.href = 'dashboard.html';
          } catch (err) {
            alert(isEn ? 'Invalid JSON file: ' + err.message : 'Tệp JSON không hợp lệ: ' + err.message);
          }
        };
        reader.readAsText(fileInput.files[0]);
      });

      window.addEventListener('languageChanged', renderExportPage);
    });

    function renderExportPage() {
      const isEn = I18N.getLang() === 'en';
      document.getElementById('exportEyebrow').textContent = isEn ? 'Data Portability' : 'Dữ liệu';
    }
  </script>
</body>
</html>
