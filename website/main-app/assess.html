<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tự Đánh Giá Năng Lực – Dolphins21</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <a href="index.html" class="brand">
        <div class="brand-icon">🐬</div>
        <span>Dolphins21</span>
      </a>
      <ul class="nav-links">
        <li><a href="dashboard.html" class="nav-link">Dashboard</a></li>
        <li><a href="assess.html" class="nav-link active">Đánh giá</a></li>
        <li><a href="focus.html" class="nav-link">Focus</a></li>
        <li><a href="goals.html" class="nav-link">Mục tiêu</a></li>
        <li><a href="evidence.html" class="nav-link">Evidence</a></li>
      </ul>
    </div>
  </header>

  <main class="page-shell">
    <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 24px; flex-wrap: wrap; gap: 16px;">
      <div>
        <span class="eyebrow">Self-Assessment Core Loop</span>
        <h1 class="page-title">Đánh Giá Năng Lực Theo Khung Building 21</h1>
        <p class="page-subtitle">Chọn Domain và Competency để đánh giá từng Indicator theo Rubric chuẩn từ Stage 1 đến Stage 4.</p>
      </div>
      <button id="btnSaveSnapshot" class="btn btn-primary">📸 Lưu Snapshot Đánh Giá</button>
    </div>

    <!-- Domain Tabs -->
    <div style="display: flex; gap: 8px; margin-bottom: 24px; overflow-x: auto; padding-bottom: 6px;" id="domainTabs">
      <!-- Tabs generated by JS -->
    </div>

    <!-- Competencies & Indicators Container -->
    <div id="assessmentContent" style="display: flex; flex-direction: column; gap: 24px;">
      <!-- Dynamic list -->
    </div>
  </main>

  <script src="js/building21-data.js"></script>
  <script src="js/api-client.js"></script>
  <script>
    let activeDomainId = 'TC1';

    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('domain')) {
        activeDomainId = urlParams.get('domain');
      }

      renderDomainTabs();
      renderAssessment();

      document.getElementById('btnSaveSnapshot').addEventListener('click', () => {
        const label = prompt('Nhập tên cho bản chụp đánh giá (Snapshot):', `Đánh giá ${new Date().toLocaleDateString('vi-VN')}`);
        if (label) {
          DolphinsStore.createSnapshot(label);
          alert('Đã lưu Snapshot thành công! Bạn có thể xem lại trong mục So sánh Dashboard.');
        }
      });
    });

    function renderDomainTabs() {
      const tabs = document.getElementById('domainTabs');
      tabs.innerHTML = window.BUILDING21_DATA.domains.map(d => `
        <button class="btn ${d.id === activeDomainId ? 'btn-primary' : 'btn-secondary'}" onclick="switchDomain('${d.id}')" style="white-space: nowrap;">
          ${d.id} · ${d.name}
        </button>
      `).join('');
    }

    function switchDomain(domainId) {
      activeDomainId = domainId;
      renderDomainTabs();
      renderAssessment();
    }

    function renderAssessment() {
      const container = document.getElementById('assessmentContent');
      const ratings = DolphinsStore.getRatings();

      const comps = window.BUILDING21_DATA.competencies.filter(c => c.domain_id === activeDomainId);

      container.innerHTML = comps.map(c => {
        const indList = window.BUILDING21_DATA.indicators.filter(ind => ind.competency_id === c.id);

        return `
          <div class="surface-card">
            <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; flex-wrap: wrap; gap: 8px;">
              <div>
                <span class="eyebrow">${c.id}</span>
                <h3 style="font-size: 20px; font-weight: 800;">${c.name}</h3>
                ${c.guiding_question ? `<p style="font-size: 14px; color: var(--muted-foreground); margin-top: 4px;"><em>"${c.guiding_question}"</em></p>` : ''}
              </div>
              <a href="focus-detail.html?comp=${c.id}" class="btn btn-secondary btn-sm">Xem chi tiết & Goal →</a>
            </div>

            <div style="display: flex; flex-direction: column; gap: 20px;">
              ${indList.map(ind => {
                const currentRating = ratings[ind.id] ? ratings[ind.id].stage : null;

                return `
                  <div style="border-top: 1px solid var(--border); padding-top: 16px;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                      <strong style="font-size: 14px; color: var(--foreground);">Chỉ số #${ind.indicator_index} (${ind.id})</strong>
                      <div>
                        ${currentRating ? `<span class="badge badge-stage-${currentRating}">Stage ${currentRating}</span>` : '<span class="badge" style="background: #f5f5f5;">Chưa đánh giá</span>'}
                      </div>
                    </div>

                    <!-- 4-Stage Rubric Grid -->
                    <div class="rubric-grid">
                      <div class="rubric-stage-card ${currentRating === 1 ? 'selected' : ''}" onclick="selectStage('${ind.id}', 1, '${c.id}', '${activeDomainId}')">
                        <div class="rubric-stage-title">Stage 1 (Novice)</div>
                        <div>${ind.rubric_stage1}</div>
                      </div>

                      <div class="rubric-stage-card ${currentRating === 2 ? 'selected' : ''}" onclick="selectStage('${ind.id}', 2, '${c.id}', '${activeDomainId}')">
                        <div class="rubric-stage-title">Stage 2 (Developing)</div>
                        <div>${ind.rubric_stage2}</div>
                      </div>

                      <div class="rubric-stage-card ${currentRating === 3 ? 'selected' : ''}" onclick="selectStage('${ind.id}', 3, '${c.id}', '${activeDomainId}')">
                        <div class="rubric-stage-title">Stage 3 (Proficient)</div>
                        <div>${ind.rubric_stage3}</div>
                      </div>

                      <div class="rubric-stage-card ${currentRating === 4 ? 'selected' : ''}" onclick="selectStage('${ind.id}', 4, '${c.id}', '${activeDomainId}')">
                        <div class="rubric-stage-title">Stage 4 (Mentor)</div>
                        <div>${ind.rubric_stage4}</div>
                      </div>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        `;
      }).join('');
    }

    function selectStage(indicatorId, stage, compId, domainId) {
      DolphinsStore.saveRating(indicatorId, stage, compId, domainId);
      renderAssessment();
    }
  </script>
</body>
</html>
