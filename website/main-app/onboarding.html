<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dolphins21 – Onboarding</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <a href="index.html" class="brand">
        <div class="brand-icon">🐬</div>
        <span>Dolphins21</span>
      </a>
      <ul class="nav-links">
        <li><a href="dashboard.html" class="nav-link" data-i18n="nav_dashboard">Tổng quan</a></li>
        <li><a href="assess.html" class="nav-link" data-i18n="nav_assessment">Đánh giá</a></li>
        <li><a href="growth.html" class="nav-link" data-i18n="nav_growth">Kế hoạch</a></li>
      </ul>
    </div>
  </header>

  <main class="page-shell">
    <div style="max-width: 680px; margin: 0 auto;">
      <span class="eyebrow" id="onboardEyebrow">Onboarding</span>
      <h1 class="page-title" data-i18n="onboard_title">Chào mừng bạn</h1>
      <p class="page-subtitle" data-i18n="onboard_subtitle">
        Khởi tạo hồ sơ giáo viên để cá nhân hóa lộ trình phát triển.
      </p>

      <div class="surface-card">
        <h3 style="font-size: 18px; font-weight: 800; margin-bottom: 16px;" data-i18n="onboard_card_title">Hồ sơ giáo viên</h3>
        <form id="profileForm">
          <div class="form-group">
            <label class="form-label">
              <span data-i18n="onboard_name">Họ và tên</span>
            </label>
            <input type="text" id="nameInput" class="form-input" required placeholder="Ví dụ: Hoàng Nam">
            <span class="form-helper" id="nameHelper">Tên hiển thị trên hồ sơ</span>
          </div>

          <div class="form-group">
            <label class="form-label">
              <span data-i18n="onboard_subject">Môn giảng dạy</span>
            </label>
            <input type="text" id="subjectInput" class="form-input" required placeholder="Ví dụ: Toán học, STEM">
            <span class="form-helper" id="subjectHelper">Lĩnh vực giảng dạy chính</span>
          </div>

          <div class="form-group">
            <label class="form-label" data-i18n="onboard_years">Năm kinh nghiệm</label>
            <input type="number" id="yearsInput" class="form-input" min="0" max="50" placeholder="Ví dụ: 5">
            <span class="form-helper" id="yearsHelper">Số năm đứng lớp thực tế</span>
          </div>

          <div class="form-group">
            <label class="form-label" data-i18n="onboard_school">Trường / Cơ sở</label>
            <input type="text" id="schoolInput" class="form-input" placeholder="Ví dụ: THCS Đổi Mới">
            <span class="form-helper" id="schoolHelper">Đơn vị công tác hiện tại</span>
          </div>

          <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 12px;" data-i18n="onboard_btn_submit">
            Lưu & Vào Dashboard →
          </button>

          <div style="text-align: center; margin-top: 16px;">
            <button type="button" id="btnLoadSample" class="btn btn-secondary btn-sm" style="font-size: 13px;" data-i18n="btn_load_sample">
              ✨ Dữ liệu mẫu
            </button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <script src="js/api-client.js"></script>
  <script src="js/i18n.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      renderOnboarding();

      // For new onboarding survey, keep inputs clean and blank so teacher enters their own real info
      const urlParams = new URLSearchParams(window.location.search);
      const isNew = urlParams.get('mode') === 'new';

      if (!isNew) {
        const profile = DolphinsStore.getProfile();
        // Only fill if it's not a sample/dummy name
        if (profile && profile.name && profile.name !== 'Thầy Nguyễn Hoàng Nam' && profile.name !== 'teacher_default') {
          document.getElementById('nameInput').value = profile.name || '';
          document.getElementById('subjectInput').value = profile.subject || '';
          document.getElementById('yearsInput').value = profile.years_experience || '';
          document.getElementById('schoolInput').value = profile.school || '';
        }
      }

      document.getElementById('profileForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const profileData = {
          name: document.getElementById('nameInput').value.trim(),
          subject: document.getElementById('subjectInput').value.trim(),
          years_experience: parseInt(document.getElementById('yearsInput').value) || 0,
          school: document.getElementById('schoolInput').value.trim()
        };
        DolphinsStore.saveProfile(profileData);
        window.location.href = 'dashboard.html';
      });

      document.getElementById('btnLoadSample').addEventListener('click', () => {
        DolphinsStore.loadSampleData();
        window.location.href = 'dashboard.html';
      });

      window.addEventListener('languageChanged', renderOnboarding);
    });

    function renderOnboarding() {
      const isEn = I18N.getLang() === 'en';
      document.getElementById('onboardEyebrow').textContent = isEn ? 'Onboarding' : 'Thiết lập';
      document.getElementById('nameHelper').textContent = isEn ? 'Display name' : 'Tên hiển thị trên hồ sơ';
      document.getElementById('subjectHelper').textContent = isEn ? 'Primary field' : 'Lĩnh vực giảng dạy chính';
      document.getElementById('yearsHelper').textContent = isEn ? 'Years in teaching' : 'Số năm đứng lớp thực tế';
      document.getElementById('schoolHelper').textContent = isEn ? 'School or institution' : 'Đơn vị công tác hiện tại';
    }
  </script>
</body>
</html>
